name: Send Account Data Massal

on:
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Target Gmail Penerima Laporan'
        required: true
      otp_code:
        description: 'Data Akun Gmail Buatan (Dari Website)'
        required: true

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Format Data Akun ke HTML
        id: format_data
        shell: bash
        run: |
          # Memproses input: memecah per baris, lalu memecah dengan |
          # Menambahkan label platform, gmail, dan password
          CONTENT=$(echo "${{ github.event.inputs.otp_code }}" | awk -F'|' '{
            printf "platform: google<br>gmail: %s<br>password: %s<br><br>", $1, $2
          }')
          echo "formatted_content=$CONTENT" >> $GITHUB_OUTPUT

      - name: Kirim Data Akun via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "📦 Pengiriman Daftar Akun Gmail - ZeroKageUI"
          to: ${{ github.event.inputs.target_email }}
          from: ZeroKageUI Generator <${{ secrets.GMAIL_USER }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="margin:0;padding:0;background:#0f0f1a;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f1a;padding:40px 20px;">
                <tr>
                  <td align="center">
                    <table width="520" cellpadding="0" cellspacing="0" style="background:#1a1a2e;border-radius:16px;overflow:hidden;border:1px solid #2d2d4e;width:100%;">
                      <tr>
                        <td style="background:linear-gradient(135deg,#6366f1,#a855f7);padding:30px;text-align:center;">
                          <h1 style="margin:0;color:#fff;font-size:1.6rem;font-weight:800;">📦 Uncheck By ZeroKageUI</h1>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:36px 32px;">
                          <p style="margin:0 0 24px;color:#e2e8f0;font-size:0.95rem;">Berikut adalah akun hasil uncheck:</p>
                          <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f1a;border:1px solid #3b3b5c;border-radius:12px;margin:0 0 24px;">
                            <tr>
                              <td style="padding:20px; color:#a78bfa; font-family:monospace; font-size:0.95rem; line-height:1.6;">
                                ${{ steps.format_data.outputs.formatted_content }}
                              </td>
                            </tr>
                          </table>
                          <p style="margin:0;color:#64748b;font-size:0.75rem;text-align:center;">Mohon tidak membalas pesan ini.
                          Contact admin: https://t.me/ZeroKageUi</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>
